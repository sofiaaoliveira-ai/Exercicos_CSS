        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>FlexBox</title>
        <style>
            .conteudo{
                height: 800px;
                display: flex;
                gap: 5px;
                background-color: rgb(221, 162, 145);
                /*
                
               /* comportamento do intem - linha ou coluna
                row, row-reverse, column, column-reverse*/
                flex-direction: row;
                
               /* quebra do layout
                nowwrap, wrap, wrap-reverse*/ 
                flex-wrap: wrap;

               /* distribuição dos itens na horizontal
                flex-star, flex-end, center, space-between, space-around*/
                justify-content: space-around;

               /*distribuição dos itens na vertical
                 stretch, center, flex-star, flex-end, baseline  */
                align-items: center;
                          
              
            }

         .item{
                width: 260px;
                height: 320px;
                background: rgb(237, 167, 167);
                border-radius: 15px;
                text-align: center;

            } 
            .item img{
                border-radius: 15px;
               width: 100%;
               height: 200px;
            }
            button{
                background-color: blue;
                border-radius: 20px;
                padding: 10px;
            }

            button:hover{
                background-color: rgb(38, 38, 104);
                border-radius: 20px;
                padding: 10px;
            }

        </style>
    </head>
